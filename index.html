<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f15a24" />
    <meta name="description" content="KDCCE — a course-project nonprofit website UI for supporting older persons in Kibera." />
    <title>KDCCE | Kibera Day Care Center for the Elderly</title>
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kdcce-theme');
          var wantsDark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (wantsDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
