# Dev environment: hot-reloading Flask + Vite dev servers via bind mounts.
# No custom Dockerfiles — official base images, source lives on the host.
# Not intended for production deployment.
services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "5000:5000"
    environment:
      FLASK_APP: wsgi.py
      DATABASE_URL: sqlite:////app/instance/kdcce.db
      CORS_ORIGINS: http://localhost:5173
      SECRET_KEY: dev-secret-change-me
      JWT_SECRET_KEY: dev-jwt-secret-change-me
    command: >
      bash -c "pip install -r requirements.txt &&
               flask db upgrade &&
               flask run --host 0.0.0.0 --port 5000"

  frontend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
